<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitbook</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f4f3ef; --ink: #14161a; --red: #c8261f; --muted: #5b5f66; --card: #fff; --line: #e2e0d9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161a; --ink: #f4f3ef; --muted: #a9adb4; --card: #1d2026; --line: #2c3038; --red: #f0544a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 Barlow, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px 40px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .brand img { width: 44px; height: 44px; border-radius: 10px; }
  h1 { font: 700 2rem/1.05 'Barlow Condensed', sans-serif; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.01em; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { flex: 1; font: 600 1rem 'Barlow Condensed', sans-serif; text-transform: uppercase; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  section[hidden] { display: none; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  li { display: flex; gap: 12px; align-items: flex-start; }
  .n { flex: 0 0 30px; height: 30px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font: 700 1.1rem 'Barlow Condensed', sans-serif; }
  .ico { display: inline-block; vertical-align: -4px; }
  .after { margin: 14px 0 0; color: var(--muted); font-size: 0.95rem; }
  .why { margin-top: 18px; color: var(--muted); font-size: 0.95rem; }
  a.go { display: block; text-align: center; margin-top: 18px; padding: 12px; border-radius: 12px; background: var(--red); color: #fff; text-decoration: none; font: 700 1.1rem 'Barlow Condensed', sans-serif; text-transform: uppercase; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; font: 17px Barlow, system-ui, sans-serif; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  button.go { width: 100%; border: 0; cursor: pointer; }
  .show { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-weight: 400; }
  .show input { width: auto; }
  .err { color: var(--red); margin: 10px 0 0; min-height: 1.2em; }
  .ok { width: 54px; height: 54px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; margin-bottom: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="icons/icon-192.png" alt=""><strong style="font:700 1.4rem 'Barlow Condensed',sans-serif;">PITBOOK</strong></div>
  <section id="box">
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <form id="pw-form" hidden novalidate>
      <label for="pw" id="pw-label"></label>
      <input type="password" id="pw" autocomplete="new-password" minlength="6" required>
      <label class="show"><input type="checkbox" id="pw-show"> <span id="pw-show-label"></span></label>
      <p class="err" id="err" role="alert"></p>
      <button type="submit" class="go" id="pw-go"></button>
    </form>
    <a class="go" id="open" href="./" hidden></a>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="action.js"></script>
</body>
</html>
