<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="Pitbook for track riders">Pitbook pour les pilotes</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pitbook">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="Pitbook pour les pilotes">
<meta property="og:description" content="Tes chronos, ta progression, tes amis, ta moto et ton budget, au même endroit. Gratuit.">
<meta property="og:url" content="https://pitbook.fr/pilotes.html">
<meta property="og:image" content="https://pitbook.fr/icons/og-pitbook.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Pitbook, le carnet de bord de la piste">

<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f4f3ef; --ink: #14161a; --red: #c8261f; --muted: #5b5f66; --card: #fff; --line: #e2e0d9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161a; --ink: #f4f3ef; --muted: #a9adb4; --card: #1d2026; --line: #2c3038; --red: #f0544a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 Barlow, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px 40px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .brand img { width: 44px; height: 44px; border-radius: 10px; }
  h1 { font: 700 2rem/1.05 'Barlow Condensed', sans-serif; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.01em; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { flex: 1; font: 600 1rem 'Barlow Condensed', sans-serif; text-transform: uppercase; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  section[hidden] { display: none; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  li { display: flex; gap: 12px; align-items: flex-start; }
  .n { flex: 0 0 30px; height: 30px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font: 700 1.1rem 'Barlow Condensed', sans-serif; }
  .ico { display: inline-block; vertical-align: -4px; }
  .after { margin: 14px 0 0; color: var(--muted); font-size: 0.95rem; }
  .why { margin-top: 18px; color: var(--muted); font-size: 0.95rem; }
  a.go { display: block; text-align: center; margin-top: 18px; padding: 12px; border-radius: 12px; background: var(--red); color: #fff; text-decoration: none; font: 700 1.1rem 'Barlow Condensed', sans-serif; text-transform: uppercase; }
  section + section { margin-top: 14px; }
  h2 { font: 700 1.25rem/1.1 'Barlow Condensed', sans-serif; text-transform: uppercase; margin: 0 0 12px; }
  ul.plus { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  ul.plus li { display: block; padding-left: 16px; position: relative; }
  ul.plus li::before { content: ''; position: absolute; left: 0; top: 0.6em; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
  a.go + a.alt { display: block; text-align: center; margin-top: 10px; color: var(--ink); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 14px; }
  .kpis div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; }
  .kpis b { display: block; font: italic 800 1.25rem/1.05 'Barlow Condensed', sans-serif; color: var(--red); text-transform: uppercase; }
  .kpis span { font-size: 0.82rem; color: var(--muted); line-height: 1.25; display: block; margin-top: 4px; }
  .gains { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .gains li { display: flex; gap: 12px; align-items: flex-start; }
  .gi { flex: 0 0 34px; height: 34px; border-radius: 10px; background: var(--bg); color: var(--red); display: grid; place-items: center; }
  .gi svg { width: 20px; height: 20px; }
  .gains b { display: block; }
  .gains span.t { color: var(--muted); font-size: 0.95rem; }
  ol.when li b { display: block; }
  ul.not { margin: 0; padding-left: 18px; color: var(--muted); }
  ul.not li { margin: 4px 0; display: list-item; }
  .alt-links { text-align: center; margin-top: 12px; display: grid; gap: 8px; }
  .alt-links a { color: var(--ink); }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="icons/icon-192.png" alt=""><strong style="font:700 1.4rem 'Barlow Condensed',sans-serif;">PITBOOK</strong></div>
  <h1 data-fr="Le carnet du pilote amateur" data-en="The amateur rider&#x27;s logbook">Le carnet du pilote amateur</h1>
  <p class="lead" data-fr="Tes chronos, ta progression, tes amis, ta moto (ou ta voiture) et ton budget, au même endroit. Même au paddock, sans réseau. Gratuit." data-en="Your lap times, your progress, your friends, your bike (or your car) and your budget, all in one place. Even in the paddock, with no signal. Free."></p>
  <div class="kpis"><div><b data-fr="1 photo" data-en="1 photo"></b><span data-fr="de ta feuille de temps, et tes tours sont lus" data-en="of your timesheet, and your laps are read"></span></div><div><b data-fr="0 boîtier" data-en="0 device"></b><span data-fr="à acheter : les chronos de l&#x27;orga suffisent" data-en="to buy: the organiser&#x27;s timing is enough"></span></div><div><b data-fr="Hors ligne" data-en="Offline"></b><span data-fr="tout marche au paddock, même sans réseau" data-en="everything works in the paddock, even with no signal"></span></div></div>
  <section>
    <h2 data-fr="Ce que tu y gagnes" data-en="What you get"></h2>
    <ul class="gains">
      <li><span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></span><span><b data-fr="Tu vois tes progrès" data-en="You see your progress"></b><span class="t" data-fr="Ton record sur chaque circuit, et ce que tu gagnes session après session." data-en="Your record on every circuit, and what you gain session after session."></span></span></li>
      <li><span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21V7h6v14M3 21v-9h6M15 21v-6h6M2 21h20"/></svg></span><span><b data-fr="Tu te mesures" data-en="You measure up"></b><span class="t" data-fr="Le podium entre amis sur chaque circuit, et des championnats quand tu cours." data-en="The friends&#x27; podium on every circuit, and championships when you race."></span></span></li>
      <li><span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg></span><span><b data-fr="Tu es prêt le jour J" data-en="You&#x27;re ready on the day"></b><span class="t" data-fr="Ton groupe et tes horaires en grand, le compte à rebours, ta checklist." data-en="Your group and schedule in big type, the countdown, your checklist."></span></span></li>
      <li><span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></span><span><b data-fr="Tu connais ta machine" data-en="You know your machine"></b><span class="t" data-fr="Moto ou voiture : tes véhicules, tes trains de pneus et tes réglages, notés par toi." data-en="Bike or car: your vehicles, tyre sets and setup, logged by you."></span></span></li>
      <li><span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 6.5a7 7 0 1 0 0 11"/><path d="M4 10h9M4 14h9"/></svg></span><span><b data-fr="Tu tiens ton budget" data-en="You keep to your budget"></b><span class="t" data-fr="Le prix des roulages, tes frais, et le total de ta saison." data-en="Trackday prices, your costs, and your season total."></span></span></li>
      <li><span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></span><span><b data-fr="Tu as ta vitrine" data-en="You get a showcase"></b><span class="t" data-fr="Ta page de pilote : perfs, trophées, réseaux, sponsors et teams." data-en="Your rider page: perfs, trophies, socials, sponsors and teams."></span></span></li>
    </ul>
  </section>
  <section>
    <h2 data-fr="Ton premier roulage avec Pitbook" data-en="Your first trackday with Pitbook"></h2>
    <ol class="when">
      <li><span class="n">1</span><span><b data-fr="Avant" data-en="Before"></b><span data-fr="Installe l&#x27;appli, ouvre-la une minute avec du réseau et ajoute ton prochain roulage." data-en="Install the app, open it for a minute with a signal and add your next trackday."></span></span></li>
      <li><span class="n">2</span><span><b data-fr="Le matin" data-en="In the morning"></b><span data-fr="L&#x27;écran du jour J affiche ton groupe et tes horaires." data-en="The race-day screen shows your group and your schedule."></span></span></li>
      <li><span class="n">3</span><span><b data-fr="Après tes sessions" data-en="After your sessions"></b><span data-fr="Prends en photo la feuille de temps, et note tes réglages." data-en="Take a photo of the timesheet, and note your setup."></span></span></li>
      <li><span class="n">4</span><span><b data-fr="Le soir" data-en="In the evening"></b><span data-fr="Ta journée session par session, puis le podium des amis." data-en="Your day session by session, then the friends&#x27; podium."></span></span></li>
    </ol>
  </section>
  <section>
    <h2 data-fr="Ce que Pitbook ne fait pas" data-en="What Pitbook doesn&#x27;t do"></h2>
    <ul class="not">
      <li data-fr="Pas d&#x27;inscription ni de paiement : ça reste chez l&#x27;organisateur." data-en="No booking or payment: that stays with the organiser."></li>
      <li data-fr="Pas de chrono officiel : Pitbook lit celui de l&#x27;orga." data-en="No official timing: Pitbook reads the organiser&#x27;s."></li>
      <li data-fr="Aucun conseil de réglage ni de pression : tu notes tes valeurs, c&#x27;est tout." data-en="No setup or pressure advice: you log your values, that&#x27;s all."></li>
      <li data-fr="Tes réglages, tes pressions et ton budget : ces données sont privées." data-en="Your setup, pressures and budget: this data is private."></li>
    </ul>
  </section>
  <p class="why" data-fr="Une question, une idée ? Dans l&#x27;appli : Réglages › Donner mon avis." data-en="A question, an idea? In the app: Settings › Give feedback."></p>
  <a class="go" href="./" data-fr="Créer mon compte" data-en="Create my account">Créer mon compte</a>
  <div class="alt-links"><a href="installer.html" data-fr="Installer l&#x27;appli sur mon téléphone" data-en="Install the app on my phone">Installer l'appli</a><a href="organisateurs.html" data-fr="Tu organises des roulages ?" data-en="You organise trackdays?">Tu organises des roulages ?</a><a href="accompagnants.html" data-fr="Tu accompagnes un pilote ?" data-en="Coming along with a rider?">Tu accompagnes un pilote ?</a></div>
</main>
<script src="installer.js"></script>
</body>
</html>
