<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Pitbook">

<meta property="og:description" content="Chronos, roulages, véhicules et budget au même endroit. Marche sans réseau. Gratuit.">
<meta property="og:url" content="https://pitbook.fr/pilotes.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f4f3ef; --ink: #14161a; --red: #c8261f; --muted: #5b5f66; --card: #fff; --line: #e2e0d9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161a; --ink: #f4f3ef; --muted: #a9adb4; --card: #1d2026; --line: #2c3038; --red: #f0544a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 Barlow, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px 40px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .brand img { width: 44px; height: 44px; border-radius: 10px; }
  h1 { font: 700 2rem/1.05 'Barlow Condensed', sans-serif; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.01em; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { flex: 1; font: 600 1rem 'Barlow Condensed', sans-serif; text-transform: uppercase; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  section[hidden] { display: none; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  li { display: flex; gap: 12px; align-items: flex-start; }
  .n { flex: 0 0 30px; height: 30px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font: 700 1.1rem 'Barlow Condensed', sans-serif; }
  .ico { display: inline-block; vertical-align: -4px; }
  .after { margin: 14px 0 0; color: var(--muted); font-size: 0.95rem; }
  .why { margin-top: 18px; color: var(--muted); font-size: 0.95rem; }
  a.go { display: block; text-align: center; margin-top: 18px; padding: 12px; border-radius: 12px; background: var(--red); color: #fff; text-decoration: none; font: 700 1.1rem 'Barlow Condensed', sans-serif; text-transform: uppercase; }
  section + section { margin-top: 14px; }
  h2 { font: 700 1.25rem/1.1 'Barlow Condensed', sans-serif; text-transform: uppercase; margin: 0 0 12px; }
  ul.plus { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  ul.plus li { display: block; padding-left: 16px; position: relative; }
  ul.plus li::before { content: ''; position: absolute; left: 0; top: 0.6em; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
  a.go + a.alt { display: block; text-align: center; margin-top: 10px; color: var(--ink); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 14px; }
  .kpis div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; }
  .kpis b { display: block; font: italic 800 1.25rem/1.05 'Barlow Condensed', sans-serif; color: var(--red); text-transform: uppercase; }
  .kpis span { font-size: 0.82rem; color: var(--muted); line-height: 1.25; display: block; margin-top: 4px; }
  .gains { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .gains li { display: flex; gap: 12px; align-items: flex-start; }
  .gi { flex: 0 0 34px; height: 34px; border-radius: 10px; background: var(--bg); color: var(--red); display: grid; place-items: center; }
  .gi svg { width: 20px; height: 20px; }
  .gains b { display: block; }
  .gains span.t { color: var(--muted); font-size: 0.95rem; }
  ol.when li b { display: block; }
  ul.not { margin: 0; padding-left: 18px; color: var(--muted); }
  ul.not li { margin: 4px 0; display: list-item; }
  .alt-links { text-align: center; margin-top: 12px; display: grid; gap: 8px; }
  .alt-links a { color: var(--ink); }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="icons/icon-192.png" alt=""><strong style="font:700 1.4rem 'Barlow Condensed',sans-serif;">PITBOOK</strong></div>
  <h1 data-fr="Le carnet du pilote" data-en="The rider&#x27;s logbook">Le carnet du pilote</h1>
  <p class="lead" data-fr="Chronos, roulages, véhicules et budget au même endroit. Marche sans réseau. Gratuit." data-en="Lap times, trackdays, vehicles and budget in one place. Works offline. Free."></p>
  <div class="kpis"><div><b data-fr="1 photo" data-en="1 photo"></b><span data-fr="de la feuille de temps : les tours sont lus" data-en="of the timesheet: the laps are read"></span></div><div><b data-fr="0 boîtier" data-en="0 device"></b><span data-fr="à acheter" data-en="to buy"></span></div><div><b data-fr="Hors ligne" data-en="Offline"></b><span data-fr="au paddock, sans réseau" data-en="in the paddock, no signal needed"></span></div></div>
  <section>
    <h2 data-fr="Dans ton carnet" data-en="In your logbook"></h2>
    <ul class="gains">
      <li><span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></span><span><b data-fr="Note tes progrès" data-en="Log your progress"></b><span class="t" data-fr="Ton record par circuit, session après session." data-en="Your record per circuit, session after session."></span></span></li>
      <li><span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21V7h6v14M3 21v-9h6M15 21v-6h6M2 21h20"/></svg></span><span><b data-fr="Partage avec tes amis" data-en="Share with your friends"></b><span class="t" data-fr="Le podium, circuit par circuit." data-en="The podium, circuit by circuit."></span></span></li>
      <li><span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg></span><span><b data-fr="Sois fin prêt le jour J" data-en="Be ready on the day"></b><span class="t" data-fr="Ton groupe, tes horaires, ta checklist." data-en="Your group, your schedule, your checklist."></span></span></li>
      <li><span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></span><span><b data-fr="Note tes réglages" data-en="Log your setup"></b><span class="t" data-fr="Véhicules, pneus et réglages." data-en="Vehicles, tyres and setup."></span></span></li>
      <li><span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 6.5a7 7 0 1 0 0 11"/><path d="M4 10h9M4 14h9"/></svg></span><span><b data-fr="Suis ton budget" data-en="Track your budget"></b><span class="t" data-fr="Roulages, frais, total de la saison." data-en="Trackdays, costs, season total."></span></span></li>
      <li><span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></span><span><b data-fr="Résume ta saison" data-en="Sum up your season"></b><span class="t" data-fr="Perfs, trophées, réseaux, sponsors, teams." data-en="Perfs, trophies, socials, sponsors, teams."></span></span></li>
    </ul>
  </section>
  <section>
    <h2 data-fr="Ton premier roulage avec Pitbook" data-en="Your first trackday with Pitbook"></h2>
    <ol class="when">
      <li><span class="n">1</span><span><b data-fr="Avant" data-en="Before"></b><span data-fr="Installe l&#x27;appli et ajoute ton roulage, avec du réseau." data-en="Install the app and add your trackday, with a signal."></span></span></li>
      <li><span class="n">2</span><span><b data-fr="Le matin" data-en="In the morning"></b><span data-fr="Ouvre Chrono : ton groupe et tes horaires." data-en="Open Chrono: your group and schedule."></span></span></li>
      <li><span class="n">3</span><span><b data-fr="Après tes sessions" data-en="After your sessions"></b><span data-fr="Photographie la feuille de temps, note tes réglages." data-en="Snap the timesheet, log your setup."></span></span></li>
      <li><span class="n">4</span><span><b data-fr="Le soir" data-en="In the evening"></b><span data-fr="Revois ta journée, session par session." data-en="Review your day, session by session."></span></span></li>
    </ol>
  </section>
  <section>
    <h2 data-fr="Ce que Pitbook ne fait pas" data-en="What Pitbook doesn&#x27;t do"></h2>
    <ul class="not">
      <li data-fr="Ni inscription ni paiement : c&#x27;est chez l&#x27;orga." data-en="No booking or payment: that&#x27;s with the organiser."></li>
      <li data-fr="Pas de chrono officiel : Pitbook lit celui de l&#x27;orga." data-en="No official timing: Pitbook reads the organiser&#x27;s."></li>
      <li data-fr="Aucun conseil : tu notes tes valeurs." data-en="No advice: you log your values."></li>
      <li data-fr="Réglages, pressions et budget restent privés." data-en="Setup, pressures and budget stay private."></li>
    </ul>
  </section>
  <p class="why" data-fr="Une question, une idée ? Réglages › Donner mon avis." data-en="A question, an idea? Settings › Give feedback."></p>
  <a class="go" href="./" data-fr="Créer mon compte" data-en="Create my account">Créer mon compte</a>
  <div class="alt-links"><a href="installer.html" data-fr="Installer l&#x27;appli sur mon téléphone" data-en="Install the app on my phone">Installer l'appli</a><a href="organisateurs.html" data-fr="Le guide des organisateurs" data-en="The organisers' guide">Le guide des organisateurs</a><a href="accompagnants.html" data-fr="Le guide des accompagnants" data-en="The companions' guide">Le guide des accompagnants</a></div>
</main>
<script src="installer.js"></script>
</body>
</html>
